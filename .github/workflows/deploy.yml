name: Deploy Cluster Book to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Build Book with Native Cluster SSG
        run: |
          chmod +x bin/cluster-ssg
          ./bin/cluster-ssg
          sed -i 's|href="/chapter|href="chapter|g' dist/*.html dist/tags/*.html 2>/dev/null || true
          sed -i 's|href="/index.html|href="index.html|g' dist/*.html dist/tags/*.html 2>/dev/null || true
          sed -i 's|href="/static/|href="static/|g' dist/*.html dist/tags/*.html 2>/dev/null || true
          sed -i 's|src="/static/|src="static/|g' dist/*.html dist/tags/*.html 2>/dev/null || true
          sed -i 's|url="/chapter|url="chapter|g' dist/search-index.json dist/api/*.json 2>/dev/null || true
          touch dist/.nojekyll

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
